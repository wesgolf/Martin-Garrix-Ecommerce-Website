<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse the current public Martin Garrix shop catalog, including T-shirts, hoodies, jackets, accessories and kids pieces.">
  <meta name="theme-color" content="#111111">
  <meta property="og:title" content="Shop All — Martin Garrix Store">
  <meta property="og:description" content="Explore every Martin Garrix collection and find your front-row uniform.">
  <meta property="og:type" content="website">
  <title>Shop All — Martin Garrix Store</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="store.css">
  <script src="catalog.js" defer></script>
  <script src="store.js" defer></script>
</head>
<body data-page="shop" id="top">
  <div data-site-header></div>

  <main id="main-content">
    <header class="catalog-hero catalog-hero--shop">
      <div>
        <p class="eyebrow" data-catalog-hero-kicker>Current catalog / Official product feed</p>
        <h1 data-catalog-hero-title>ALL<br>PRODUCTS.</h1>
      </div>
      <div class="catalog-hero__aside">
        <p class="eyebrow" data-catalog-hero-context>+ × / Martin Garrix &amp; STMPD RCRDS</p>
        <p>Forty-two current products with official titles, euro prices, availability and photography from the public shop catalog.</p>
      </div>
    </header>

    <section class="catalog-shell" aria-label="Product catalog">
      <div class="catalog-toolbar" data-catalog-controls>
        <div class="filter-chips" role="group" aria-label="Filter products by category">
          <button class="is-active" type="button" data-category="all">All</button>
          <button type="button" data-category="tshirts">T-shirts</button>
          <button type="button" data-category="hoodies">Hoodies</button>
          <button type="button" data-category="outerwear">Jackets</button>
          <button type="button" data-category="accessories">Accessories</button>
          <button type="button" data-category="kids">Kids</button>
        </div>
        <div class="catalog-tools">
          <label class="catalog-search">
            <span class="sr-only">Search products</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
            <input type="search" data-catalog-search placeholder="SEARCH PRODUCTS" autocomplete="off">
          </label>
          <label class="catalog-sort-wrap">
            <span class="sr-only">Sort products</span>
            <select data-catalog-sort>
              <option value="featured">Featured</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
              <option value="name">Name: A–Z</option>
            </select>
          </label>
        </div>
        <p class="product-count" data-product-count aria-live="polite">42 items</p>
      </div>
      <div class="product-grid catalog-grid" data-product-grid data-catalog-grid></div>
    </section>
  </main>

  <div data-site-footer></div>
</body>
</html>
