<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Sentio double vinyl</title>
  <desc id="desc">A black vinyl record alongside a monochrome Sentio album sleeve.</desc>
  <defs>
    <radialGradient id="record">
      <stop offset="0" stop-color="#4c4c4c"/>
      <stop offset=".16" stop-color="#161616"/>
      <stop offset=".19" stop-color="#353535"/>
      <stop offset="1" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282828"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="405" cy="317" r="180" fill="url(#record)"/>
    <circle cx="405" cy="317" r="69" fill="#ecebe7"/>
    <circle cx="405" cy="317" r="12" fill="#111"/>
    <path d="M267 177h284M242 217h326M225 257h361M222 297h366M226 337h358M237 377h336M257 417h296M289 457h231" stroke="#777" stroke-width="1" opacity=".18"/>
    <rect x="92" y="114" width="330" height="412" fill="url(#cover)"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="8">
    <path d="M169 221h161M249 141v160"/>
    <rect x="178" y="296" width="148" height="148" transform="rotate(45 252 370)"/>
    <path d="m170 289 167 167M337 289 170 456" opacity=".75"/>
  </g>
  <text x="253" y="490" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="17" letter-spacing="9">SENTIO</text>
</svg>
